# O Supabase gratuito pausa o projeto depois de 7 dias sem uso.
# Este job consulta o banco a cada 3 dias para mantê-lo ativo até o churrasco.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          # A senha errada é proposital: a chamada chega ao Postgres e é recusada.
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            -X POST "https://zfcqzmueksrztenpvfsd.supabase.co/rest/v1/rpc/admin_rsvps" \
            -H "apikey: sb_publishable_wvldFlywdtahaTfqiwRlPA_MaC24B4H" \
            -H "Content-Type: application/json" \
            -d '{"senha":"ping"}'
